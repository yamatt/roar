name: Lint Actions Lock

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**.yml"

jobs:
  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Actions Lock extension to GitHub CLI
        run: |
          gh extension install github/gh-actions-lock
      - name: Check actions lock is valid
        run: |
          gh actions-lock --verify
